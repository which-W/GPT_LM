[project]
name = "sft-training"
version = "0.1.0"
description = "SFT training pipeline with vLLM evaluation"
requires-python = ">=3.11,<3.13"

dependencies = [
    # PyTorch 生态 — 显式指定从 pytorch-cu124 源拉，三者版本必须对齐
    "torch==2.6.0",
    "torchaudio==2.6.0",
    "torchvision==0.21.0",


    # HuggingFace 生态
    # 保持后训练与可选 vLLM 后端使用同一代 Transformers 接口
    "transformers==4.57.6",
    "tokenizers==0.22.2",

    # 训练工具
    "trl==0.15.2",
    "einops==0.8.2",

    # 实验追踪
    "wandb>=0.25.0",

    # 数据工具
    "datasets>=3.0.0,<4.0.0",
    "pandas>=2.2.0,<3.0.0",
    "tqdm>=4.66.0",
    "safetensors>=0.4.0",
    "xxhash==3.5.0",

    # 数学验证（reward_fn 依赖）
    "latex2sympy2-extended==1.11.0",
    "math-verify==0.9.0",
    "pylatexenc==2.10",

    # API 调用
    "openai==1.57.4",

    # 数值计算
    "numpy>=1.26.0,<3.0.0",
]

[project.optional-dependencies]
vllm = ["vllm==0.8.5.post1; sys_platform == 'linux'"]

# ============================================================
# uv 索引配置
# ============================================================

# 清华镜像作为默认源（国内服务器首选）
# 如果清华镜像也慢，可换备选：
#   阿里云： https://mirrors.aliyun.com/pypi/simple
#   腾讯云： https://mirrors.cloud.tencent.com/pypi/simple
#   中科大： https://pypi.mirrors.ustc.edu.cn/simple
[[tool.uv.index]]
name = "tuna"
url = "https://pypi.tuna.tsinghua.edu.cn/simple"

# PyTorch cu124 源设为 explicit，只有被显式标注的包才从这里拉
[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

# ============================================================
# torch / torchaudio / torchvision 显式绑定到 pytorch-cu124 源
# ============================================================
[tool.uv.sources]
torch       = { index = "pytorch-cu124" }
torchvision = { index = "pytorch-cu124" }
torchaudio  = { index = "pytorch-cu124" }

# ============================================================
# 开发依赖（可选）
# ============================================================
[dependency-groups]
dev = [
    "ipykernel>=6.29.0",
    "jupyter>=1.0.0",
]
